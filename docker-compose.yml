version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storyline-postgres
    environment:
      POSTGRES_DB: storyline_erp
      POSTGRES_USER: storyline
      POSTGRES_PASSWORD: storyline_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyline -d storyline_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storyline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: storyline-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@storyline.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
