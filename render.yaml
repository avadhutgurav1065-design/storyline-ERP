services:
  - type: web
    name: storyline-erp-backend
    env: java
    plan: free
    branch: main
    # Using maven to build the multi-module project targeting storyline-app
    buildCommand: "./mvnw clean install -DskipTests"
    startCommand: "java -jar storyline-app/target/storyline-app-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Update this value in the Render dashboard to point to your Vercel URL once deployed
        value: "*"
