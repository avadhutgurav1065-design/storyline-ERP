# ==============================================================
# Storyline Event Management ERP — Application Configuration
# ==============================================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: storyline-erp
  profiles:
    active: supabase

  # PostgreSQL Database
  datasource:
    url: jdbc:postgresql://localhost:5432/storyline_erp
    username: storyline
    password: storyline_dev_2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ==============================================================
# JWT Configuration
# ==============================================================
app:
  jwt:
    # Base64 encoded secret key (256-bit minimum for HS256)
    secret: c3RvcnlsaW5lLWVycC1zZWNyZXQta2V5LXRoaXMtaXMtYS12ZXJ5LWxvbmctc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctcHVycG9zZQ==
    access-token-expiration: 86400000    # 24 hours in milliseconds
    refresh-token-expiration: 604800000  # 7 days in milliseconds

# ==============================================================
# Swagger / OpenAPI
# ==============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ==============================================================
# Logging
# ==============================================================
logging:
  level:
    root: INFO
    com.storyline.erp: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
